<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="todo">
    <h1 class="todo__title">To-do</h1>
    <form class="todo__form">
      <input class="todo__input todo-ip" type="text" id="inp-td" placeholder="What needs to be done?">
      <button class="todo__add todo-ip" type="submit" id="sub-ad">Add</button>
    </form>
    <div class="todo__controls">
    <div>
      <input class="todo__checkbox todo-ip" type="checkbox" id="sel_all" disabled>
      <label for="sel_all">Select all</label></div>
      <button class="todo__delete todo-ip" type="button" id="del_complete" disabled>
        Delete completed
      </button>
    </div>
    <section class="todo__columns">
        <button class="todo__column-title todo-ip" id="btn_all_tsk" disabled>All</button>
        <button class="todo__column-title todo-ip" id="btn_active_tsk" disabled>Active</button>
        <button class="todo__column-title todo-ip " id="btn_completed_tsk" disabled>Complete</button>
    </section>
    <ul id="ch" class="todo__list">

    </ul>
    <!-- <nav class="todo__pagination" aria-label="Pagination">
      <a class="todo__page todo__page--disabled todo-ip" href="#"><</a>
      <a class="todo__page todo__page--active todo-ip" href="#">1</a>
      <a class="todo__page todo-ip" href="#">2</a>
      <a class="todo__page todo-ip" href="#">3</a>
      <a class="todo__page todo-ip" href="#">></a>
    </nav> -->
  </main>
  <script src="./main.js"></script>
</body>
</html>
