<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .todo {
      width: 100%;
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .todo__title {
      margin-bottom: 25px;
      font-size: 36px;
      text-align: center;
    }

    /* Add task */
    .todo__form {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .todo__input {
      flex: 1;
      height: 46px;
      padding: 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .todo__input:focus {
      border-color: #888;
    }

    .todo__add {
      height: 46px;
      padding: 0 22px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    /* Controls */
    .todo__controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .todo__checkbox {
      width: 20px;
      height: 20px;
    }

    .todo__delete {
      height: 40px;
      padding: 0 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #e9e9e9;
      color: #999;
      cursor: not-allowed;
    }

    /* Columns */
    .todo__columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 35px;
    }

    .todo__column {
      min-height: 250px;
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .todo__column-title {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
      text-transform: uppercase;
    }

    .todo__list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo__item {
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      background: #fafafa;
    }

    /* Pagination */
    .todo__pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .todo__page {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #222;
      text-decoration: none;
    }

    .todo__page--active {
      background: #222;
      border-color: #222;
      color: #fff;
    }

    .todo__page--disabled {
      color: #aaa;
      background: #eee;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .todo__columns {
        grid-template-columns: 1fr;
      }

      .todo__form {
        flex-direction: column;
      }

      .todo__add {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="todo">
    <h1 class="todo__title">To-do List</h1>

    <!-- Input + Add button -->
    <form class="todo__form">
      <input
        class="todo__input"
        type="text"
        placeholder="What needs to be done?"
      >

      <button class="todo__add" type="submit">
        Add
      </button>
    </form>

    <!-- Disabled controls -->
    <div class="todo__controls">
      <input
        class="todo__checkbox"
        type="checkbox"
        disabled
      >

      <button
        class="todo__delete"
        type="button"
        disabled
      >
        Delete completed
      </button>
    </div>

    <!-- Three columns -->
    <section class="todo__columns">

      <div class="todo__column">
        <h2 class="todo__column-title">All</h2>

        <div class="todo__list">
          <div class="todo__item">Learn HTML</div>
          <div class="todo__item">Learn CSS</div>
          <div class="todo__item">Build a website</div>
        </div>
      </div>

      <div class="todo__column">
        <h2 class="todo__column-title">Active</h2>

        <div class="todo__list">
          <div class="todo__item">Learn CSS</div>
          <div class="todo__item">Build a website</div>
        </div>
      </div>

      <div class="todo__column">
        <h2 class="todo__column-title">Completed</h2>

        <div class="todo__list">
          <div class="todo__item">Learn HTML</div>
        </div>
      </div>

    </section>

    <!-- Pagination -->
    <nav class="todo__pagination" aria-label="Pagination">
      <a class="todo__page todo__page--disabled" href="#">
        ←
      </a>

      <a class="todo__page todo__page--active" href="#">
        1
      </a>

      <a class="todo__page" href="#">
        2
      </a>

      <a class="todo__page" href="#">
        3
      </a>

      <a class="todo__page" href="#">
        →
      </a>
    </nav>

  </main>

</body>
</html>
